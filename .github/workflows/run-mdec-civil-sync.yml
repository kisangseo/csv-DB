name: run-mdec-civil-sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: run-mdec-civil-sync-main
  cancel-in-progress: false

jobs:
  run-mdec-civil-sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ENDPOINT_URL: https://bcso-cvdb-dwbnfmcjggf2f2a0.centralus-01.azurewebsites.net/sync-mdec-civil-documents
      INGEST_KEY: ${{ secrets.RETURNS_INGEST_KEY }}

    steps:
      - name: Match MDEC documents to Civil Papers
        run: |
          curl --fail --show-error --silent --location \
            --header "X-Ingest-Key: $INGEST_KEY" \
            "$ENDPOINT_URL"
