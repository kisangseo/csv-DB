<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | BCSO Search Portal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='portal-theme.css') }}">
</head>
<body class="portal-theme">
  {% include "portal_header.html" %}
  <main class="portal-sign-in">
    <h1>Sign in</h1>
    {% if error %}<p class="portal-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post">
      <label>Email <input name="email" type="email" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="portal-primary">Sign in</button>
    </form>
  </main>
</body>
</html>
